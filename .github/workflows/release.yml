name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-android:
    name: Signed release APK + checksums
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode signing keystore
        env:
          PB_KEYSTORE_BASE64: ${{ secrets.PB_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$PB_KEYSTORE_BASE64" ]; then
            echo "$PB_KEYSTORE_BASE64" | base64 -d > signing.keystore
            echo "storeFile=signing.keystore" >> local.properties
          else
            echo "PB_KEYSTORE_BASE64 not set; falling back to debug-signed release" >&2
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Compute SHA256SUMS.txt
        shell: bash
        working-directory: .
        run: |
          cd android/app/build/outputs/apk/release
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Build AltStore source JSON
        shell: bash
        working-directory: .
        run: bash scripts/make-altstore-json.sh "${GITHUB_REF_NAME}" || true

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/release/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/release/SHA256SUMS.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
