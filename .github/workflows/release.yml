name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-android:
    name: Signed release APK + checksums
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup update stable
          rustup target add aarch64-linux-android armv7-linux-androideabi
          cargo install --locked cargo-ndk

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.0.12077973'

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            core/target
          key: ${{ runner.os }}-cargo-ndk-${{ hashFiles('core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-ndk-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Cross-compile Rust core (arm64-v8a + armeabi-v7a)
        working-directory: core
        run: |
          cargo ndk -t aarch64-linux-android -t armv7-linux-androideabi \
            -o ../android/app/src/main/jniLibs build --release

      - name: Decode signing keystore
        working-directory: android
        env:
          PB_KEYSTORE_BASE64: ${{ secrets.PB_KEYSTORE_BASE64 }}
          PB_KEYSTORE_PASSWORD: ${{ secrets.PB_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$PB_KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            echo "$PB_KEYSTORE_BASE64" | base64 -d > keystore/pocketbridge-release.keystore
            echo "keystore decoded"
          else
            echo "PB_KEYSTORE_BASE64 not set: CI falls back to the Gradle debug-signed path (not for store distribution)" >&2
          fi

      - name: Grant execute permission for gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Build release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify APK signature + native libs
        working-directory: android
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --print-certs "$APK" | head -3
          unzip -l "$APK" | grep libpocketbridge_core.so

      - name: Compute SHA256SUMS.txt
        run: |
          cd android/app/build/outputs/apk/release
          sha256sum app-release.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Build AltStore source JSON
        run: bash scripts/make-altstore-json.sh "${GITHUB_REF_NAME}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/apk/release/SHA256SUMS.txt
            altstore-source.json
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
