name: android-ci

on:
  push:
    branches: [main]
    paths: ['android/**', 'protocol/**', '.github/workflows/android-ci.yml']
  pull_request:
    paths: ['android/**', 'protocol/**', '.github/workflows/android-ci.yml']

jobs:
  build:
    name: Gradle lint + unit tests + debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle.kts') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate Protobuf sources
        shell: bash
        working-directory: .
        run: bash scripts/gen-proto.sh --android || echo "gen-proto skipped (plugin missing); Gradle handles codegen"

      - name: Gradle lintDebug
        run: ./gradlew lintDebug

      - name: Gradle unit tests
        run: ./gradlew testDebugUnitTest

      - name: Gradle assembleDebug
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pocketbridge-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
