name: Bug Report
description: Report a reproducible bug in PocketBridge (Android, iOS, or Core).
labels: ["bug"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - core (Rust / Noise / Framing)
        - android (Bridge app)
        - ios (Client app)
        - protocol (Protobuf / SPEC)
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      placeholder: 1. Pair device... 2. Trigger...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
    validations:
      required: true
