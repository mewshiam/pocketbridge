[package]
name = "pocketbridge-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Shared E2EE BLE framing, Noise_XX, pairing, and L2CAP audio crypto core for PocketBridge"

[lib]
name = "pocketbridge_core"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"

[dependencies]
base64 = "0.22"
chacha20poly1305 = "0.10"
hex = "0.4"
hkdf = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
snow = "0.9"
thiserror = "2.0"
uniffi = { version = "0.28", features = ["cli"] }
zeroize = { version = "1.8", features = ["derive"] }
